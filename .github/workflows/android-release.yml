name: Android signed release (optional)
on: workflow_dispatch
jobs:
  release:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: android } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.7' }
      - name: Require signing secrets
        env: { KS: '${{ secrets.ANDROID_KEYSTORE_BASE64 }}' }
        run: test -n "$KS" || { echo "ANDROID_KEYSTORE_BASE64 secret missing"; exit 1; }
      - name: Decode keystore
        run: echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > "$RUNNER_TEMP/release.keystore"
      - name: Write local config
        run: |
          {
            echo "SUPABASE_URL=${{ secrets.SUPABASE_URL }}"
            echo "SUPABASE_ANON_KEY=${{ secrets.SUPABASE_ANON_KEY }}"
            echo "GOOGLE_MAPS_API_KEY=${{ secrets.GOOGLE_MAPS_API_KEY_ANDROID }}"
            echo "CRED_PUBLIC_KEY_B64=${{ secrets.CRED_PUBLIC_KEY_B64 }}"
          } > drivelink.properties
      - name: Build signed release
        run: >
          gradle assembleRelease
          -Pandroid.injected.signing.store.file="$RUNNER_TEMP/release.keystore"
          -Pandroid.injected.signing.store.password="${{ secrets.ANDROID_KEYSTORE_PASSWORD }}"
          -Pandroid.injected.signing.key.alias="${{ secrets.ANDROID_KEY_ALIAS }}"
          -Pandroid.injected.signing.key.password="${{ secrets.ANDROID_KEY_PASSWORD }}"
      - uses: actions/upload-artifact@v4
        with:
          name: DriveLink-release
          path: android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
