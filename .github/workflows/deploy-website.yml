name: Deploy website
on:
  push: { branches: [main], paths: ['index.html', 'website/**'] }
  workflow_dispatch:
permissions: { contents: read, pages: write, id-token: write }
concurrency: { group: pages, cancel-in-progress: true }
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: { name: github-pages, url: '${{ steps.deployment.outputs.page_url }}' }
    steps:
      - uses: actions/checkout@v4
      - name: Assemble site
        run: |
          mkdir -p _site website/config
          cp index.html _site/
          cp -r website _site/website
          # Only override the committed config when the maps key secret is set (the Supabase URL/anon key are already in config.js).
          if [ -n "${{ secrets.GOOGLE_MAPS_API_KEY_WEB }}" ]; then
            sed -i 's|googleMapsApiKey: ""|googleMapsApiKey: "${{ secrets.GOOGLE_MAPS_API_KEY_WEB }}"|' _site/website/config/config.js
          fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with: { path: _site }
      - id: deployment
        uses: actions/deploy-pages@v4
