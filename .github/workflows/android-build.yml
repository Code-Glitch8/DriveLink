name: Build Android APK
on:
  push: { branches: [main, master] }
  pull_request:
  workflow_dispatch:
permissions: { contents: read }
jobs:
  build:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: android } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - name: Prepare Android SDK
        run: |
          mkdir -p "$HOME/.android"
          touch "$HOME/.android/repositories.cfg"
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: ''
      - name: Install required Android SDK packages
        run: |
          yes | sdkmanager --licenses
          sdkmanager "platforms;android-34" "build-tools;34.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.7' }
      - name: Write build config
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          GOOGLE_MAPS_API_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY_ANDROID }}
          CRED_PUBLIC_KEY_B64: ${{ secrets.CRED_PUBLIC_KEY_B64 }}
        run: |
          # Optional secrets: empty values fall back to the project defaults / disable the feature.
          { echo "SUPABASE_URL=$SUPABASE_URL"; echo "SUPABASE_ANON_KEY=$SUPABASE_ANON_KEY";
            echo "GOOGLE_MAPS_API_KEY=$GOOGLE_MAPS_API_KEY"; echo "CRED_PUBLIC_KEY_B64=$CRED_PUBLIC_KEY_B64"; } > drivelink.properties
      - name: Build debug APK
        run: gradle assembleDebug --stacktrace
      - name: Collect APK
        run: cp app/build/outputs/apk/debug/app-debug.apk "$GITHUB_WORKSPACE/DriveLink-debug.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: DriveLink-debug-apk
          path: DriveLink-debug.apk
          if-no-files-found: error
      - name: Unit tests (non-blocking)
        continue-on-error: true
        run: gradle testDebugUnitTest --stacktrace
      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-report
          path: android/app/build/reports/tests/testDebugUnitTest
          if-no-files-found: ignore
