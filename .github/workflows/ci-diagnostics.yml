name: CI diagnostics (temporary)
# TEMPORARY: builds the app and publishes a short report (compiler errors / test failures) to the `ci-report` branch,
# so build problems can be diagnosed without opening the Actions log. Safe to delete at any time (and delete the branch).
on:
  push: { branches: [feature/maplibre-migration] }
  workflow_dispatch:
permissions: { contents: write }
jobs:
  diagnose:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: android } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - name: Prepare Android SDK
        run: |
          mkdir -p "$HOME/.android"
          touch "$HOME/.android/repositories.cfg"
      - uses: android-actions/setup-android@v3
        with:
          packages: ''
      - name: Install required Android SDK packages
        run: |
          yes | sdkmanager --licenses
          sdkmanager "platforms;android-34" "build-tools;34.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.7' }
      - name: Build debug APK
        id: build
        continue-on-error: true
        run: gradle assembleDebug --console=plain > "$GITHUB_WORKSPACE/build.log" 2>&1
      - name: Unit tests
        id: tests
        continue-on-error: true
        run: gradle testDebugUnitTest --console=plain > "$GITHUB_WORKSPACE/test.log" 2>&1
      - name: Publish report to ci-report branch
        if: always()
        env:
          BUILD_OUTCOME: ${{ steps.build.outcome }}
          TEST_OUTCOME: ${{ steps.tests.outcome }}
        run: |
          cd "$GITHUB_WORKSPACE"
          ex() { [ -f "$1" ] && grep -E "$2" "$1" | head -n "$3" || true; }
          {
            echo "# CI report for ${GITHUB_SHA}"
            echo "build: ${BUILD_OUTCOME}  tests: ${TEST_OUTCOME}"
            echo; echo "## build log excerpt"; echo '```'
            ex build.log '^e: |error:|What went wrong|Execution failed|Could not resolve|incompatible|Manifest merger|FAILURE|BUILD (SUCCESSFUL|FAILED)|warning:.*(deprecat|Unresolved)' 80
            echo '```'; echo; echo "## test log excerpt"; echo '```'
            ex test.log 'FAILED|tests completed|BUILD (SUCCESSFUL|FAILED)|^e: |Execution failed' 40
            echo '```'; echo; echo "run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          } > report.md
          rm -rf /tmp/rep && mkdir /tmp/rep && cp report.md /tmp/rep/report.md && cd /tmp/rep
          git init -q && git config user.name "ci-diagnostics" && git config user.email "ci@users.noreply.github.com"
          git checkout -q -b ci-report && git add report.md && git commit -q -m "CI report for ${GITHUB_SHA}"
          git push -q --force "https://x-access-token:${{ github.token }}@github.com/${GITHUB_REPOSITORY}.git" ci-report
      - name: Fail if the build failed
        if: steps.build.outcome == 'failure'
        run: exit 1
