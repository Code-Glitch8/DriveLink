name: CI diagnostics (temporary)
# TEMPORARY: builds the app on pull requests and comments the compiler errors / test failures on the PR,
# so build problems can be diagnosed without opening the Actions log. Safe to delete at any time.
on: pull_request
permissions: { contents: read, pull-requests: write }
jobs:
  diagnose:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: android } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - name: Prepare Android SDK
        run: |
          mkdir -p "$HOME/.android"
          touch "$HOME/.android/repositories.cfg"
      - uses: android-actions/setup-android@v3
        with:
          packages: ''
      - name: Install required Android SDK packages
        run: |
          yes | sdkmanager --licenses
          sdkmanager "platforms;android-34" "build-tools;34.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.7' }
      - name: Build debug APK
        id: build
        continue-on-error: true
        run: gradle assembleDebug --console=plain > "$GITHUB_WORKSPACE/build.log" 2>&1
      - name: Unit tests
        id: tests
        continue-on-error: true
        run: gradle testDebugUnitTest --console=plain > "$GITHUB_WORKSPACE/test.log" 2>&1
      - name: Comment result on the PR
        if: always()
        uses: actions/github-script@v7
        env:
          BUILD_OUTCOME: ${{ steps.build.outcome }}
          TEST_OUTCOME: ${{ steps.tests.outcome }}
        with:
          script: |
            const fs = require('fs');
            const read = f => fs.existsSync(f) ? fs.readFileSync(f, 'utf8').split('\n') : [];
            const pick = (lines, re, max) => lines.filter(l => re.test(l)).slice(0, max);
            const b = read(process.env.GITHUB_WORKSPACE + '/build.log');
            const t = read(process.env.GITHUB_WORKSPACE + '/test.log');
            const buildErrors = pick(b, /^e: |error:|What went wrong|Execution failed|Could not resolve|incompatible|Manifest merger|FAILURE|BUILD (SUCCESSFUL|FAILED)/, 60);
            const testErrors = pick(t, /FAILED|tests completed|BUILD (SUCCESSFUL|FAILED)|^e: /, 30);
            const body = [
              '### CI diagnostics (temporary)',
              `**Build:** ${process.env.BUILD_OUTCOME}  |  **Unit tests:** ${process.env.TEST_OUTCOME}`,
              '', '<details open><summary>Build log excerpt</summary>', '', '```', ...buildErrors, '```', '</details>',
              '', '<details><summary>Test log excerpt</summary>', '', '```', ...testErrors, '```', '</details>',
              '', `Run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            ].join('\n');
            await github.rest.issues.createComment({ owner: context.repo.owner, repo: context.repo.repo, issue_number: context.issue.number, body });
      - name: Fail if the build failed
        if: steps.build.outcome == 'failure'
        run: exit 1
